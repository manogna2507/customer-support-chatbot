<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat History - ShopSmart AI</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="navbar">
    <h2>🛍 ShopSmart AI</h2>

    <div class="nav-links">
        <a href="/">🏠 Home</a>
        <a href="/history">📜 History</a>
        <a href="/logout">🚪 Logout</a>
    </div>
</div>

<div class="container">

    <div class="header">
        <h1>📜 Chat History</h1>
        <p>Your previous conversations</p>
    </div>

    <div id="chatbox">

        {% if chats %}

            {% for chat in chats %}

            <div class="message user">
                <div class="bubble">
                    👤 {{ chat[0] }}
                    <div class="time">{{ chat[2] }}</div>
                </div>
            </div>

            <div class="message bot">
                <div class="bubble">
                    🤖 {{ chat[1].replace('\n', '<br>') | safe }}
                </div>
            </div>

            {% endfor %}

        {% else %}

        <div class="message bot">
            <div class="bubble">
                🤖 No chat history found.
            </div>
        </div>

        {% endif %}

    </div>

    <div style="padding:20px;text-align:center;">
        <a href="/">
            <button>⬅ Back to Chatbot</button>
        </a>
    </div>

</div>

</body>

</html>
